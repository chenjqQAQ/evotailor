[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evotailor"
version = "0.1.0"
description = "Self-evolving agent-based configuration optimization for LLM inference serving"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "The EvoTailor Authors" }]
keywords = ["llm-serving", "configuration-optimization", "autotuning", "agents"]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
metrics = ["prometheus-client>=0.20"]

[project.scripts]
evotailor = "evotailor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
