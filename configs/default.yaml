campaign_id: simulated_agent_demo
run_mode: portfolio_agent
execution_backend: simulated
max_trials: 12
episode_size: 4
seed: 42
objective_direction: minimize
search_space: configs/search_spaces/common_v2.json
run_root: runs
enabled_proposers: [coverage, neighborhood]
mature_optimizer_root: ${EVOTAILOR_MATURE_ROOT}/src
mature_optimizer_policies:
  tpe: {n_startup_trials: 10, multivariate: true, prior_weight: 1.0}
  slo_guard: {T_init: 1.0, patience: 4, n_initial_random: 3, enable_blacklisting: true}
  scoot: {model_type: rf, rand_sample: 3, timeout_s: 900}
use_llm_selector: false
use_outer_agent: false
use_episode_planner: false
auto_promote_policy: false
model: gpt-5.6-sol
base_url: ${EVOTAILOR_V2_BASE_URL}
api_key_env: EVOTAILOR_PROPOSER_API_KEY
model_timeout_s: 90
model_retries: 2
simulated_noise: 0.01
command: []
command_timeout_s: 900
aiconfigurator_command: []
console_progress: true
